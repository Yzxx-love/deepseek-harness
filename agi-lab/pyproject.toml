[project]
name = "agi-lab"
version = "0.1.0"
description = "A runnable reference implementation of a general-purpose agent: plan, act, remember, reflect, evaluate."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
agi-lab = "agi_lab.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agi_lab*"]
